services:
  - type: web
    name: shillong-cafe-guide
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_MAPS_PLATFORM_KEY
        sync: false
    autoDeploy: true
