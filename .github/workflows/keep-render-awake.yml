name: keep-render-awake

# Why: Render free tier sleeps a service after ~15 min without HTTP traffic.
# This workflow pings /api/health every 10 min so the dyno stays warm.
#
# Notes on GitHub Actions cron:
# - Minimum interval Actions enforces is 5 min, but in practice cron triggers
#   can lag 5-15 min during peak load — so we use 10 min for safety margin.
# - Cron times are UTC.
# - If your repo has no activity for 60 days, Actions disables scheduled
#   workflows automatically. Push any commit to re-enable.
#
# Free Actions minutes used: ~5 sec per run × 6 runs/hour × 24h × 30d
#   ≈ 216 min/month, well under the 2000 min/month free tier on private repos
#   (unlimited on public repos).

on:
  schedule:
    - cron: "*/10 * * * *"  # every 10 minutes, UTC
  workflow_dispatch: {}      # also runs manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping health endpoint
        run: |
          set -e
          URL="https://shillongcafemap.in/api/health"
          echo "Pinging $URL ..."
          # -f: fail on HTTP errors; -sS: silent but show errors; --retry: handle cold-start lag
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors --max-time 90 "$URL"
          echo
          echo "OK at $(date -u +%FT%TZ)"
